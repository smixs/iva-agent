<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Iva</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/iva-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,125,900&family=Geologica:wght@200;300;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #f2f3f4;
        --muted: rgba(255, 255, 255, 0.56);
        --hairline: rgba(255, 255, 255, 0.14);
        --green: #86a96f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: #000;
        color: var(--text);
        font-family: "Geologica", system-ui, sans-serif;
        font-weight: 300;
        font-size: 17px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 20px;
        gap: 26px;
      }
      a {
        color: var(--text);
        text-decoration: none;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: "Archivo", sans-serif;
        font-style: italic;
        font-weight: 900;
        font-stretch: 125%;
        letter-spacing: 0.04em;
        font-size: 15px;
      }
      .wordmark img {
        width: 28px;
        height: 25px;
        flex-shrink: 0;
      }
      .wordmark .logo-type {
        width: 52px;
        height: 13px;
      }
      h1 {
        font-family: "Archivo", sans-serif;
        font-style: italic;
        font-weight: 900;
        font-stretch: 125%;
        font-size: clamp(84px, 16.5vw, 200px);
        line-height: 0.92;
        letter-spacing: -0.015em;
        color: #fff;
        padding-right: 0.06em;
      }
      .note {
        font-size: clamp(13px, 1.6vw, 15px);
        font-weight: 400;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.82);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 26px;
        font-size: 14px;
        color: var(--muted);
      }
      .links a {
        color: var(--muted);
        padding-bottom: 3px;
        border-bottom: 1px solid var(--hairline);
        transition: color 0.25s ease;
      }
      .links a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <a class="wordmark" href="/">
      <img src="/iva-mark.svg" alt="" width="28" height="25" />
      <img
        class="logo-type"
        src="/iva-wordmark.svg"
        alt="Iva"
        width="52"
        height="13"
      />
    </a>
    <h1>404</h1>
    <p class="note">Page not found.</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="/ru/" lang="ru" hreflang="ru">Русская версия</a>
    </div>
  </body>
</html>
