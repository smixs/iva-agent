\* Свидетель принятого окна (не мутант кода): намерение пропадает извне (вайп
\* каталога, откат бинаря). Durable-реестр эпох пропавшее намерение не видит, и
\* новый /new может получить эпоху не выше его пометки: сообщение, принятое до
\* этого /new, переживает сброс и попадает в новый разговор. Правило >= спасает
\* от потери (ResetEpoch-fence-eq), но не от протечки. Ожидание: NoStaleInConv.
CONSTANTS
  N = 2
  MaxSeq = 3
  MaxClock = 4
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = TRUE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer
