\* Свидетель, код до ремонта: откат пишет запись, прочитанную до сборки. ОБЯЗАН нарушать
\* EnableIsOwners (trust ждёт сборку, плагин выключили, сборка не прошла — откат включил
\* его обратно) и, без этого инварианта, TrustIsOwners (enable ждёт сборку, владелец снял
\* доверие, сборка не прошла — откат вернул доверие, которого владелец уже не давал).
CONSTANTS
  PlanNeedsTrust = TRUE
  DisableStops = TRUE
  UndoStops = TRUE
  UndoRereads = FALSE
  UpdateUndoKeeps = TRUE
  TurnRefused = TRUE
  UpdateReenables = FALSE
  UpdateOff = FALSE
  UpdateOffStops = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ProcessesNeedTrust DisabledIsStopped TrustIsOwners UpdateGrantsNothing EnableIsOwners
