\* Мутант «сверка тоже шлёт Диалог сброшен» (ConfirmOnRecovery = TRUE) —
\* пара с основным cfg, где сверка завершает сброс молча (код: finishReset
\* шлёт подтверждение только в потоке /new, reconcileScopedResetIntents —
\* нет). Трасса минимальной модели: намерение F1 записано и его remote
\* своего /new упал (NewPersist, NewRemote, NewDone), сверка дожимает
\* намерение до снятия и подтверждает его (RcScan … RcIntent), поток /new
\* доходит до своего конца и подтверждает второй раз (NewClear, NewStatus,
\* NewIntent): confirmed[F1] = 2. Ожидание: ConfirmOnce.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  MaxRestarts = 1
  MaxFails = 3
  EscalateAt = 2
  ConfirmOnRecovery = TRUE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK ConfirmOnce EscalationOnce
