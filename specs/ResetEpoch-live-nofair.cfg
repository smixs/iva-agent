\* Мутант контроля живости ResetEpoch-live (пара по fairness): те же
\* константы, но спецификация без условий справедливости — UnfairSpec. Шаг
\* Idle тогда доступен при недоделанной работе только пока она недоделана,
\* но ничто не обязывает его прерывать: поведение стоит на живом намерении
\* вечно — Finished нарушается статтерингом. Пара показывает, что гарантию
\* Finished даёт справедливость по рабочим шагам, а не форма Next.
\* Ожидание: Finished.
CONSTANTS
  N = 1
  MaxSeq = 2
  MaxClock = 3
  MaxRestarts = 1
  MaxFails = 3
  EscalateAt = 2
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION UnfairSpec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder ConfirmOnce EscalationOnce
PROPERTY Finished
