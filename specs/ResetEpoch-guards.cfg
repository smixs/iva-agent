\* Пара Guards (D65, ч.1): контроль TRUE (код) и мутант FALSE отличаются одной
\* константой. Без сверок намерения устаревший reconcile F1 завершается после
\* /new(F2): безусловное снятие ворует намерение F2, статус остаётся на F1, и
\* помеченное F1 сообщение протекает в разговор F2. Проверка по целевому
\* инварианту: потеря запоздалым remote — дефект базы, свидетель
\* ResetEpoch-late-remote. Ожидание: контроль — без ошибок, мутант —
\* NoStaleInConv.
CONSTANTS
  N = 2
  MaxSeq = 3
  MaxClock = 4
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv
