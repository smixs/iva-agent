\* Mutant: allow a bridge request before the completed turn parks.
\* The code (every code switch TRUE, R3 and R4 included), replies to bot messages, one /stop,
\* a compact request that may be accepted after the client's timeout (LatePost), 3 messages,
\* 2 steps per turn, every invariant of spec section 7.
\* Policy queue, no restart, with liveness. Expected: no error.
CONSTANTS
  CancelKeepsStop = TRUE
  Policy = "queue"
  MaxMsgs = 3
  MaxSteps = 2
  MaxRestarts = 0
  MaxStops = 1
  Bypass = TRUE
  LatePost = TRUE
  LongCompaction = FALSE
  AwaitPost = TRUE
  ReleaseOnlyCompacting = TRUE
  ClaimChat = TRUE
  OpenGuard = TRUE
  SilentReap = TRUE
  TurnClears = TRUE
  DueOnce = TRUE
  DueChecksOff = TRUE
  ParkRelease = TRUE
  Reaper = TRUE
  QueueReplies = TRUE
  DropOnFail = TRUE
  DropEndsAsk = TRUE
  Reclaim = TRUE
  BeginClaim = TRUE
  BeginAnyIdle = FALSE
ManualParked <- ManualPostTurn
SPECIFICATION Spec
INVARIANT CompactionGuarded
