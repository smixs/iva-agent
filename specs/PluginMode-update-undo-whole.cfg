\* Свидетель, код до ремонта: откат несобравшегося `iva plugin update` возвращает прежнюю
\* запись целиком. ОБЯЗАН нарушать ProcessesNeedTrust (пока шла сборка, владелец доверил —
\* откат снял доверие, юниты работают), без него TrustIsOwners (владелец снял доверие — откат
\* вернул его без нового тапа), а без обоих EnableIsOwners (то же с выключением и снятием).
CONSTANTS
  PlanNeedsTrust = TRUE
  DisableStops = TRUE
  UndoStops = TRUE
  UndoRereads = TRUE
  UpdateUndoKeeps = FALSE
  TurnRefused = TRUE
  UpdateReenables = FALSE
  UpdateOff = FALSE
  UpdateOffStops = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK ProcessesNeedTrust DisabledIsStopped TrustIsOwners UpdateGrantsNothing EnableIsOwners
