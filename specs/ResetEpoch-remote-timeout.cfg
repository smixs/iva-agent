\* Мутант «слот без журнала эпох у роута» (RemoteSlot = TRUE, WireFence =
\* FALSE) — дыра возврата S69: клиентский таймаут/обрыв не отменяет серверный
\* вызов. Трасса минимальной модели: Boot → F1 записан, его remote /new выпущен и
\* кончился клиентским таймаутом — вызов остался живым в wire (NewPersist,
\* NewRemote, NewDone-обрыв) → отсрочка истекла (Expire) → reconcile
\* выпускает второй вызов F1 (слот
\* свободен: клиент уже не ждёт), его ответ падает первым, намерение
\* завершено и снято (RcScan, RcRemote, RcDone, RcPost, RcClear, RcStatus,
\* RcIntent) → принятое под F1 доставлено в разговор (Admit, Promote) →
\* запоздалый серверный вызов F1 падает (SrvLand): сообщение gone,
\* mDrop = aseq = 1. Симметричная трасса — таймаут вызова reconcile, дубль
\* от следующего прохода сверки. Пара с контролем
\* ResetEpoch-remote-timeout-fence: отличаются одной константой WireFence —
\* журнал эпох закрывает окно, которое слот не закрывает. Ожидание:
\* LossOnlyByNewer.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder
