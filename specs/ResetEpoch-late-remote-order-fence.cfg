\* Контроль мутанта ResetEpoch-late-remote-order (пара D65): те же константы
\* модели при включённом журнале упавших эпох у роута (WireFence = TRUE). Пара
\* отличается одной константой: контроль ждёт «No error», мутант — нарушение
\* RemoteInOrder.
CONSTANTS
  N = 1
  MaxSeq = 2
  MaxClock = 2
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = FALSE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK RemoteInOrder
