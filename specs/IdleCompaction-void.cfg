INVARIANTS TypeOK MessageAccounted QueuedWhileCompacting CompactionGuarded TurnRecordKept NoFalseInterruptNotice NoCancelMarkForCompaction CompactingNeverInTurn OffOnlyAfterUselessCompaction AtMostOneAskPerTurn NoStackedCompaction NoAskOverCompactingRecord NoAskWhileOff
