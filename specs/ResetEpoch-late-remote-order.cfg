\* Мутант «без исправления T341» (RemoteSlot = FALSE, WireFence = FALSE),
\* вторая грань того же дефекта: запоздалый remote старого намерения падает
\* после remote нового /new и откатывает convSeq. Трасса: Boot → F1 записан, его
\* remote кончился сбоем клиента и остался в wire (NewPersist, NewRemote,
\* NewDone-обрыв, Expire) → reconcile выпускает второй вызов F1 и его ответ падает
\* (RcScan, RcRemote, RcDone) → /new F2 записан, его remote падает
\* (NewPersist, NewRemote, NewDone) → запоздалый серверный вызов F1 падает
\* (SrvLand): convSeq = 1 при wipeMax = 2. Пара с контролем
\* ResetEpoch-late-remote-order-fence: отличаются одной константой WireFence;
\* LossOnlyByNewer показывает свидетель ResetEpoch-late-remote. Ожидание:
\* RemoteInOrder.
CONSTANTS
  N = 1
  MaxSeq = 2
  MaxClock = 2
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = FALSE
  WireFence = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK RemoteInOrder
