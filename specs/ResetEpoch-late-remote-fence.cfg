\* Контроль мутанта ResetEpoch-late-remote (пара D65): те же константы модели
\* при включённом журнале упавших эпох у роута (WireFence = TRUE). Пара
\* отличается одной константой: контроль ждёт «No error», мутант — нарушение
\* LossOnlyByNewer. Запоздалый вызов до сервера доходит — журнал отклоняет его
\* исполнение, клиентский слот для безопасности не нужен.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = FALSE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder
