\* Свидетель: сверка загрузила намерение, её вызов агента висит, а /new тем временем прошёл
\* целиком и следующее сообщение уже в новой сессии; запоздалый сброс сверки стирает её.
\* Нужен простой getUpdates дольше отсрочки 30 с. Принятое окно (отчёт v5), ждём ExactCut.
CONSTANTS
  N = 3
  News = {2}
  MaxFail = 2
  MaxRestarts = 1
  EscalateAt = 2
  ClearFirst = FALSE
  ClearAll = FALSE
  ConfirmOnRecovery = FALSE
  ConfirmWindow = FALSE
  RecInterleave = TRUE
SPECIFICATION Spec
INVARIANTS ExactCut
