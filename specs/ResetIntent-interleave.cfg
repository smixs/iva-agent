\* Мутант (5): сверка берёт очередь чата, но не перечитывает намерение с диска. Скан прочитал
\* намерение, /new тем же чатом прошёл целиком, доставка положила следующее сообщение в новую
\* сессию — и запоздалый удалённый сброс сверки по записанному cut стирает её. Ждём ExactCut.
CONSTANTS
  N = 3
  News = {2}
  MaxFail = 2
  MaxRestarts = 1
  EscalateAt = 2
  ClearFirst = FALSE
  ClearAll = FALSE
  ConfirmOnRecovery = FALSE
  ConfirmWindow = FALSE
  RecInterleave = TRUE
  RecReread = FALSE
  SessionCompletion = TRUE
  AgentStale = TRUE
SPECIFICATION Spec
INVARIANTS ExactCut
