\* МУТАНТ: запись только в установку, зеркала нет, и чтение расхождение не чинит.
\* Обновление ставит выпуск зеркала — то есть не то, что выбрал владелец; записи
\* расходятся навсегда. Нарушает OneRecord (1) и AgreeAfterRead (2).
CONSTANTS
  TwoSides = FALSE
  RepairOnRead = FALSE
  RollbackWorks = TRUE
  BelowAllowed = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK OneRecord AgreeAfterRead NotBelow
