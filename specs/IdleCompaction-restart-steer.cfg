\* The code (every code switch TRUE, R3 and R4 included), replies to bot messages, one /stop,
\* a compact request that may be accepted after the client's timeout (LatePost), 3 messages,
\* 2 steps per turn, every invariant of spec section 7.
\* Liveness is not checked with a restart: a process killed in the window between the start of a
\* compaction and its hook hangs the session (finding F6, -window-restart).
\* Policy steer, one restart, without CompactionGuarded and QueuedWhileCompacting (F7).
\* Expected: no error.
CONSTANTS
  Policy = "steer"
  MaxMsgs = 3
  MaxSteps = 2
  MaxRestarts = 1
  MaxStops = 1
  Bypass = TRUE
  LatePost = TRUE
  LongCompaction = FALSE
  AwaitPost = TRUE
  ReleaseOnlyCompacting = TRUE
  ClaimChat = TRUE
  OpenGuard = TRUE
  SilentReap = TRUE
  TurnClears = TRUE
  DueOnce = TRUE
  DueChecksOff = TRUE
  ParkRelease = TRUE
  Reaper = TRUE
  QueueReplies = TRUE
  DropOnFail = TRUE
  DropEndsAsk = TRUE
  Reclaim = TRUE
  BeginClaim = TRUE
  BeginAnyIdle = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK MessageAccounted TurnRecordKept NoFalseInterruptNotice NoCancelMarkForCompaction CompactingNeverInTurn OffOnlyAfterUselessCompaction AtMostOneAskPerTurn NoStackedCompaction NoAskOverCompactingRecord NoAskWhileOff NoHangAfterRestart
