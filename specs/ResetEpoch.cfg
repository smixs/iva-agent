\* Код dd50c6ad + T325 (пометка >= границы) + T326 (монотонная эпоха) + T341
\* (слот remote-сброса на чат + эпоха на проводе и журнал упавших эпох у
\* роута): все сверки намерения и живой эпохи, эпоха = max(clock, floor),
\* статус пишет max. Пропажа намерения извне выключена (принятое окно —
\* свидетель ResetEpoch-abandon). Remote: выпуски сериализованы на чат, вызов
\* за уже упавшую эпоху не выпускается, а дошедший до сервера вызов с эпохой
\* не новее упавшей журнал отклоняет — запоздалый remote после клиентского
\* таймаута свежий разговор не трёт (возврат S69). Контроль исправления —
\* мутант ResetEpoch-late-remote (обе защиты выключены); дыру слота без
\* журнала показывает мутант ResetEpoch-remote-timeout. Ожидание: зелёный.
CONSTANTS
  N = 2
  MaxSeq = 3
  MaxClock = 4
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder
