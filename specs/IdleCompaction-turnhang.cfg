  Policy = "queue"
  MaxMsgs = 3
  MaxSteps = 2
  MaxRestarts = 1
  MaxStops = 1
  Bypass = TRUE
  LatePost = TRUE
  LongCompaction = TRUE
  AwaitPost = TRUE
  ReleaseOnlyCompacting = TRUE
  ClaimChat = TRUE
  OpenGuard = TRUE
  SilentReap = TRUE
  TurnClears = TRUE
  DueOnce = TRUE
  DueChecksOff = TRUE
  ParkRelease = TRUE
  Reaper = TRUE
  QueueReplies = TRUE
  DropOnFail = TRUE
  DropEndsAsk = TRUE
  Reclaim = TRUE
  BeginClaim = TRUE
  BeginAnyIdle = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoHangAfterRestart NoTurnHangAfterRestart
