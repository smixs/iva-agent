\* Мутант (6): запрос сброса, принятый агентом до перезапуска Bridge, переживает перезапуск и
\* завершается в любой момент позже: его resolveSession возвращает уже другую сессию, и сброс
\* стирает сообщение, которое новый Bridge доставил после отсечки. Ждём ExactCut.
CONSTANTS
  N = 3
  News = {2}
  MaxFail = 2
  MaxRestarts = 1
  EscalateAt = 2
  ClearFirst = FALSE
  ClearAll = FALSE
  ConfirmOnRecovery = FALSE
  ConfirmWindow = FALSE
  RecInterleave = TRUE
  RecReread = TRUE
  AgentStale = FALSE
SPECIFICATION Spec
INVARIANTS ExactCut
