\* Пара MonotoneEpoch (D65, ч.1): контроль TRUE (код: эпоха = max(now,
\* последняя durable + 1)) и мутант FALSE (голый Date.now) отличаются одной
\* константой; EpochMax = FALSE в обоих — запись статуса без max входит в тот
\* же мутант и в паре не различается. Без пола второй /new в ту же миллисекунду
\* получает ту же эпоху: принятое между двумя /new неотличимо от новой границы
\* и протекает в новый разговор. Ожидание: контроль — без ошибок, мутант —
\* NoStaleInConv.
CONSTANTS
  N = 2
  MaxSeq = 3
  MaxClock = 4
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = FALSE
  EpochMax = FALSE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv
