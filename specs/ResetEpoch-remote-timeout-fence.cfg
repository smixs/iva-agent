\* Контроль мутанта ResetEpoch-remote-timeout (пара по дыре S69): те же
\* константы модели при включённом журнале упавших эпох у роута
\* (WireFence = TRUE). Пара отличается одной константой: контроль ждёт
\* «No error», мутант — нарушение LossOnlyByNewer.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder
