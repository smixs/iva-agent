\* Мутант «без исправления T341» (RemoteSlot = FALSE, WireFence = FALSE):
\* выпуски двух потоков за одно намерение не упорядочены, журнала эпох у роута
\* нет, и второй серверный вызов падает после завершения эпохи и доставки.
\* Трасса минимальной модели: Boot → намерение F1 записано → reconcile выпустил свой
\* remote F1 — второй вызов в wire (RcScan, RcRemote) → remote своего /new
\* упал, завершение прошло, намерение снято (NewRemote, NewDone, NewClear,
\* NewStatus, NewIntent) → принятое под F1 доставлено в разговор (Admit,
\* Promote) → запоздалый remote reconcile падает (SrvLand/RcDone): сообщение
\* gone, mDrop = aseq = 1. Симметричная трасса — remote reconcile падает
\* первым, запоздалым оказывается remote /new. Пара с контролем
\* ResetEpoch-late-remote-fence: отличаются одной константой WireFence —
\* журнал эпох у роута отклоняет уже упавшую эпоху, контроль ждёт «No error».
\* Ожидание: LossOnlyByNewer.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = FALSE
  WireFence = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder
