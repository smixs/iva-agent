  ClaimChat = TRUE
  OpenGuard = TRUE
  SilentReap = TRUE
  TurnClears = TRUE
  DueOnce = TRUE
  DueChecksOff = TRUE
  ParkRelease = TRUE
  Reaper = TRUE
  QueueReplies = TRUE
  DropOnFail = TRUE
  DropEndsAsk = TRUE
  Reclaim = TRUE
