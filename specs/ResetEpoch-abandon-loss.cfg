\* Свидетель окна пропавшего намерения с потерей (не мутант кода; решение
\* арбитра T340). Намерение записано, его remote выпущен, и намерение пропадает
\* извне (вайп каталога, откат бинаря) — а поток /new продолжается и чистит
\* очередь его границей. Немаркированное сообщение, принятое после запроса /new
\* в ту же миллисекунду (enqueuedAt равен fence и «после» не доказывает),
\* снимается этой границей: mDrop = aseq — настоящая потеря. Трасса модели:
\* Boot -> Tick -> NewPersist -> NewRemote -> Abandon -> Admit -> Promote
\* (в очередь) -> NewClear. Помеченная ветка проверяется парой fence; здесь цель — все
\* снятия границей без исключений. Ожидание: DropAllByNewer.
CONSTANTS
  N = 2
  MaxSeq = 2
  MaxClock = 2
  MaxRestarts = 0
  MaxFails = 0
  EscalateAt = 0
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = TRUE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DropAllByNewer
