\* Proposed repair R5 (compaction.requested claims the chat for any compaction outside a turn),
\* queue, one restart, every safety invariant.
\* Liveness is not checked with a restart: a process killed in the window between the start of a
\* compaction and its hook hangs the session (finding F6, -window-restart). Expected: no error.
CONSTANTS
  Policy = "queue"
  MaxMsgs = 3
  MaxSteps = 2
  MaxRestarts = 1
  MaxStops = 1
  Bypass = TRUE
  LatePost = TRUE
  LongCompaction = FALSE
  AwaitPost = TRUE
  ReleaseOnlyCompacting = TRUE
  ClaimChat = TRUE
  OpenGuard = TRUE
  SilentReap = TRUE
  TurnClears = TRUE
  DueOnce = TRUE
  DueChecksOff = TRUE
  ParkRelease = TRUE
  Reaper = TRUE
  QueueReplies = TRUE
  DropOnFail = TRUE
  DropEndsAsk = TRUE
  Reclaim = TRUE
  BeginClaim = TRUE
  BeginAnyIdle = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK MessageAccounted QueuedWhileCompacting CompactionGuarded TurnRecordKept NoFalseInterruptNotice NoCancelMarkForCompaction CompactingNeverInTurn OffOnlyAfterUselessCompaction AtMostOneAskPerTurn NoStackedCompaction NoAskOverCompactingRecord NoAskWhileOff NoHangAfterRestart
