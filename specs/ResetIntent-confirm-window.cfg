\* Свидетель: перезапуск между «Диалог сброшен» и записью offset. Telegram отдаёт /new снова,
\* и владелец видит второе подтверждение. Принятое окно (отчёт v5, Н-окно), ждём ConfirmOnce.
CONSTANTS
  N = 3
  News = {2}
  MaxFail = 2
  MaxRestarts = 1
  EscalateAt = 2
  ClearFirst = FALSE
  ClearAll = FALSE
  ConfirmOnRecovery = FALSE
  ConfirmWindow = TRUE
  RecInterleave = TRUE
  RecReread = TRUE
SPECIFICATION Spec
INVARIANTS ConfirmOnce
