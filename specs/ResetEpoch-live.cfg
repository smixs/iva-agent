\* Контроль живости: Finished под fairness (перенос проверки прежней
\* ResetIntent в единую модель, T348). Отказы ограничены MaxFails = 3
\* (эскалация на EscalateAt = 2-м подряд доступна, второй за жизнь процесса
\* бюджет не оставляет), перезапуск один, два намерения: уступленное первое
\* дожимает сверка. Живость: pending пуст, потоки стоят и за каждым seq
\* записанного намерения упал remote его эпохи или новее. Пара — мутант
\* ResetEpoch-live-nofair (SPECIFICATION UnfairSpec): без справедливости
\* вечный статтеринг с живым намерением законен — Finished красный, пара
\* показывает, что гарантию даёт fairness. Ожидание: без ошибок.
CONSTANTS
  N = 1
  MaxSeq = 2
  MaxClock = 3
  MaxRestarts = 1
  MaxFails = 3
  EscalateAt = 2
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleInConv LossOnlyByNewer RemoteInOrder ConfirmOnce EscalationOnce
PROPERTY Finished
