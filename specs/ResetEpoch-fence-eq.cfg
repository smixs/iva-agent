\* Пара FenceRule (D65, ч.1): контроль "geq" (код) и мутант "eq" отличаются
\* одной константой. MayAbandon открывает пометку пропавшего намерения, новее
\* живой эпохи: "eq" снимает её границей прежнего намерения (mDrop < aseq),
\* "geq" держит. Проверка по DropOnlyByNewer — хронологический инвариант
\* потерь для помеченных записей (seq снявшей границы против aseq): ветка
\* mark = 0 от FenceRule не зависит и в пару не входит, её потерю показывает
\* свидетель ResetEpoch-abandon-loss; gone не считается — дефект базы
\* (ResetEpoch-late-remote). Константы ужаты до двух намерений: свидетелю
\* хватает F1 завершён → F2 пропал, полный обход контроля остаётся обозримым.
\* Ожидание: контроль — без ошибок, мутант — DropOnlyByNewer.
CONSTANTS
  N = 2
  MaxSeq = 2
  MaxClock = 2
  FenceRule = "eq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = TRUE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DropOnlyByNewer
