\* Мутант: план юнитов смотрит только на enabled. ОБЯЗАН нарушать ProcessesNeedTrust:
\* плагин поставлен без доверия — и его процессы уже работают.
CONSTANTS
  PlanNeedsTrust = FALSE
  DisableStops = TRUE
  UndoStops = TRUE
  UndoRereads = TRUE
  UpdateUndoKeeps = TRUE
  TurnRefused = TRUE
  UpdateReenables = FALSE
  UpdateOff = FALSE
  UpdateOffStops = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK ProcessesNeedTrust DisabledIsStopped TrustIsOwners UpdateGrantsNothing EnableIsOwners
