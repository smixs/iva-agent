\* Свидетель достижимости эскалации — пара к EscalationOnce, чтобы тот не
\* проверял пустое место: EscalateAt = 1, один отказ ожидания сверки, и
\* владельцу уже ушло «запусти iva reset» (escalations = 1). Трасса
\* минимальной модели: Boot -> Tick -> NewPersist -> RcScan -> RcRemote ->
\* RcDone(отказ). Ожидание: NoEscalation — свидетель, не инвариант кода.
CONSTANTS
  N = 1
  MaxSeq = 1
  MaxClock = 1
  MaxRestarts = 0
  MaxFails = 1
  EscalateAt = 1
  ConfirmOnRecovery = FALSE
  FenceRule = "geq"
  Guards = TRUE
  MonotoneEpoch = TRUE
  EpochMax = TRUE
  MayAbandon = FALSE
  RemoteSlot = TRUE
  WireFence = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoEscalation
